<!DOCTYPE html>
<html>
<head>
    <title>Zenvyra - Mock Interview</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #020617;
            padding: 20px;
            position: fixed;
            height: 100vh;
        }

        .sidebar button {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .sidebar button:hover {
            background: #6366f1;
            transform: translateX(5px);
        }

        /* MAIN */
        .main {
            margin-left: 240px;
            padding: 30px;
        }

        /* CARD */
        .card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(99,102,241,0.5);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #6366f1;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

    </style>
</head>

<body>

<!-- 🔥 SIDEBAR -->
<div class="sidebar">

    <h3 style="color:#6366f1;">🚀 Zenvyra</h3>
    <p style="font-size:12px; color:#94a3b8;">Companion</p>

    <button onclick="location.href='/'">💬 Chat</button>
    <button onclick="location.href='/practice'">💻 Practice</button>
    <button onclick="location.href='/interview'">🎤 DSA Interview</button>
    <button onclick="location.href='/core-interview'">🧠 Core Interview</button>
    <button onclick="location.href='/dashboard'">📊 Dashboard</button>

</div>

<!-- 🔥 MAIN CONTENT -->
<div class="main">

    <h1>🎤 Mock Interview</h1>

    <!-- QUESTION CARD -->
    <div class="card">
        <h3>{{ question }}</h3>
    </div>

    <!-- ANSWER INPUT -->
    <div class="card">
        <form method="POST">

            <textarea name="answer" rows="6"
                placeholder="Type your answer here..."></textarea>

            <br><br>

            <button type="submit">Submit Answer</button>

        </form>
    </div>

    <!-- FEEDBACK -->
    {% if feedback %}
    <div class="card">
        <h3>📊 Feedback</h3>
        <pre style="white-space: pre-wrap;">{{ feedback }}</pre>
    </div>
    {% endif %}

</div>

</body>
</html>
